version: '3.8'

services:
  database:
    image: kartoza/postgis:16-3.4
    container_name: bursa_postgis
    environment:
      POSTGRES_DB: bursa_gis_db
      POSTGRES_USER: postgres
      POSTGRES_PASS: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./:/data

volumes:
  pgdata: